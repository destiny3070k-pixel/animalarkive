<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Arkive - Wiki Database</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; 
      color: #333; 
      min-height: 100vh;
      margin: 0;
    }
    .navbar { 
      background-color: #2c3e50; 
      border-bottom: 3px solid #42a5f5; 
    }
    .navbar-brand { 
      font-weight: bold; 
      color: #ecf0f1 !important; 
      cursor: pointer; 
    }
    
    /* 인증 박스 전용 레이아웃 */
    .auth-container {
      max-width: 450px;
      margin: 80px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }
    .auth-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .auth-box h2 {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
    .notice {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: #fff8e1;
      color: #6d4c41;
      font-size: 13.5px;
      line-height: 1.6;
    }

    /* 메인 위키 컨테이너 */
    .wiki-container { 
      background: #html; 
      background-color: #ffffff;
      border: none;
      padding: 40px; 
      margin-top: 30px; 
      margin-bottom: 40px;
      min-height: 620px; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
      position: relative; 
    }
    .wiki-title { 
      border-bottom: 2px solid #2c3e50; 
      padding-bottom: 12px; 
      font-weight: bold; 
      margin-bottom: 22px; 
    }
    .wiki-content { 
      line-height: 1.9; 
      font-size: 1.05rem; 
    }
    .recent-list { 
      list-style: none; 
      padding-left: 0; 
    }
    .recent-list li { 
      padding: 10px 0; 
      border-bottom: 1px solid #edf1f5; 
    }
    .recent-list li a { 
      text-decoration: none; 
      color: #42a5f5; 
      font-weight: 600; 
      cursor: pointer; 
    }
    .recent-list li a:hover {
      text-decoration: underline;
    }
    
    /* 문법 안내 카드 */
    .grammar-card {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
    }

    /* 위키 문법용 컴포넌트 */
    .toc-container { 
      background: #f9f9f9; 
      border: 1px solid #ccc; 
      padding: 15px; 
      display: inline-block; 
      margin-bottom: 20px; 
      border-radius: 6px; 
      font-size: 0.95rem; 
    }
    .toc-title { 
      font-weight: bold; 
      text-align: center; 
      margin-bottom: 8px; 
      display: block; 
    }
    sup.footnote { 
      cursor: help; 
      color: #42a5f5; 
      font-weight: bold; 
      padding: 0 2px; 
    }
    .footnote-list { 
      margin-top: 50px; 
      padding-top: 20px; 
      border-top: 1px solid #eee; 
      font-size: 0.9rem; 
      color: #666; 
    }
    .footnote-tooltip { 
      position: absolute; 
      display: none; 
      background: #333; 
      color: #fff; 
      padding: 8px 12px; 
      z-index: 1000; 
      max-width: 300px; 
      border-radius: 6px; 
      font-size: 0.85rem; 
    }
    
    .hidden { 
      display: none !important; 
    }
  </style>
</head>
<body onclick="hideTooltip()">
  <div id="fnTooltip" class="footnote-tooltip"></div>

  <nav id="wikiNav" class="navbar navbar-expand-lg navbar-dark sticky-top hidden">
    <div class="container">
      <a class="navbar-brand" onclick="loadPage('메인페이지')">🦁 Animal Arkive 🐯</a>
      <div class="ms-auto d-flex align-items-center">
        <span id="userEmailDisplay" class="text-light me-3 d-none d-md-inline" style="font-size: 14px;"></span>
        <input id="searchInput" class="form-control me-2 form-control-sm" type="search" placeholder="문서 검색..." style="max-width: 180px;">
        <button class="btn btn-sm btn-outline-light me-2" onclick="searchWiki()">검색</button>
        <button class="btn btn-sm btn-primary me-2" onclick="createNewWiki()">새 문서</button>
        <button class="btn btn-sm btn-danger" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </nav>

  <div id="authSection" class="container auth-container">
    <div class="auth-box">
      <h2>Animal Arkive 로그인</h2>
      <input id="emailInput" class="form-control" type="email" placeholder="이메일 주소" />
      <input id="passwordInput" class="form-control" type="password" placeholder="비밀번호 (6자리 이상)" />
      <button class="btn btn-primary w-100 mt-2" id="loginBtn">로그인</button>
      <button class="btn btn-outline-secondary w-100" id="signupBtn">회원가입</button>
    </div>
    <div class="notice">
      처음 사용하는 계정은 <strong>회원가입</strong>을 먼저 진행하세요.<br />
      가입 완료 후 자동으로 아카이브 대시보드로 진입합니다.
    </div>
  </div>

  <div id="mainSection" class="container wiki-container hidden">
    <div id="viewMode">
      <h1 id="displayTitle" class="wiki-title">로딩 중...</h1>
      <div id="displayContent" class="wiki-content"></div>
      
      <div id="footnoteSection" class="footnote-list" style="display:none;">
        <h6 class="fw-bold">[주석]</h6>
        <ol id="footnoteItems"></ol>
      </div>
      
      <div class="mt-5 pt-3 border-top d-flex justify-content-between align-items-center">
        <small id="metaInfo" class="text-muted"></small>
        <div>
          <button id="deleteBtn" class="btn btn-sm btn-outline-danger me-2" onclick="deleteDoc()">삭제</button>
          <button id="editBtn" class="btn btn-sm btn-primary" onclick="openEditMode()">편집</button>
        </div>
      </div>
    </div>

    <div id="editMode" class="hidden">
      <h1 class="wiki-title">편집: <span id="editTitleLabel"></span></h1>
      <textarea id="editorTextarea" class="form-control mb-3" rows="20" placeholder="위키 문법을 사용하여 기록을 남겨보세요."></textarea>
      <div class="d-flex justify-content-end">
        <button class="btn btn-outline-secondary me-2" onclick="cancelEdit()">취소</button>
        <button id="saveBtn" class="btn btn-success" onclick="submitWiki()">저장하기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase,
      ref,
      get,
      set,
      remove
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 미국 리전 데이터베이스 설정
    const firebaseConfig = {
      apiKey: "AIzaSyC4iXaCgH2tDNitwtpwS4ACXYzlslYssWw",
      authDomain: "animal-arkive.firebaseapp.com",
      databaseURL: "https://animal-arkive-default-rtdb.firebaseio.com",
      projectId: "animal-arkive",
      storageBucket: "animal-arkive.firebasestorage.app",
      messagingSenderId: "463300274995",
      appId: "1:463300274995:web:918861ea4d5899f68d2c46",
      measurementId: "G-QL0GNMWNLX"
    };

    // 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM 포인터
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const wikiNav = document.getElementById('wikiNav');
    const userEmailDisplay = document.getElementById('userEmailDisplay');

    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchInput = document.getElementById('searchInput');

    let currentUser = null;
    let currentDoc = { title: '', content: '' };
    let footnotes = [];

    // 전역 스코프 바인딩 (HTML 인라인 onClick 핸들러 연동용)
    window.loadPage = loadPage;
    window.searchWiki = searchWiki;
    window.createNewWiki = createNewWiki;
    window.openEditMode = openEditMode;
    window.cancelEdit = cancelEdit;
    window.submitWiki = submitWiki;
    window.deleteDoc = deleteDoc;
    window.showTooltip = showTooltip;

    // --- 인증 관리 비즈니스 로직 ---
    function getAuthCredentials() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 기입바랍니다.');
        return null;
      }
      if (password.length < 6) {
        alert('보안을 위해 비밀번호는 6자 이상이어야 합니다.');
        return null;
      }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const creds = getAuthCredentials();
      if (!creds) return;
      try {
        await createUserWithEmailAndPassword(auth, creds.email, creds.password);
        alert('성공적으로 가입되었습니다.');
      } catch (err) { alert(getKoreanError(err.code)); }
    });

    loginBtn.addEventListener('click', async () => {
      const creds = getAuthCredentials();
      if (!creds) return;
      try {
        await signInWithEmailAndPassword(auth, creds.email, creds.password);
      } catch (err) { alert(getKoreanError(err.code)); }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // 세션 감시체계
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        wikiNav.classList.remove('hidden');
        userEmailDisplay.textContent = `${user.email}`;
        
        // 엔터키 검색 바인딩 추가
        searchInput.onkeypress = (e) => { if(e.keyCode === 13) searchWiki(); };
        
        loadPage('메인페이지');
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        wikiNav.classList.add('hidden');
        emailInput.value = '';
        passwordInput.value = '';
      }
    });

    // --- Core 위키 엔진 커스텀 구현 ---

    async function loadPage(title) {
      if (!currentUser || !title) return;
      
      document.getElementById('editMode').classList.add('hidden');
      document.getElementById('viewMode').classList.remove('hidden');
      document.getElementById('footnoteSection').style.display = 'none';
      document.getElementById('displayTitle').innerText = "데이터 로드 중...";

      if (title === '메인페이지') {
        try {
          // 최근 문서 목록 리스트업 처리 (데이터 대시보드 구조)
          const allDocsRef = ref(database, `users/${currentUser.uid}/wiki`);
          const snapshot = await get(allDocsRef);
          let listHtml = '';
          
          if (snapshot.exists()) {
            const data = snapshot.val();
            const arr = Object.values(data);
            
            // 최종 수정일 내림차순 정렬 후 최상위 10개 추출
            arr.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
            const recent = arr.slice(0, 10);
            
            listHtml = recent.map(d => {
              const safeTitle = d.title.replace(/'/g, "\\'");
              const shortDate = d.updatedAt ? d.updatedAt.substring(5, 16) : ''; // "MM-dd HH:mm" 포맷팅
              return `<li><a onclick="loadPage('${safeTitle}')">${escapeHTML(d.title)}</a> <small class="text-muted ms-2">${shortDate}</small></li>`;
            }).join('');
          }

          document.getElementById('displayTitle').innerText = "🏠 Animal Arkive Knowledge Base";
          document.getElementById('displayContent').innerHTML = `
            <div class="row mt-4">
              <div class="col-md-7">
                <h5 class="fw-bold mb-3 border-bottom pb-2">📑 최근 수정된 아카이브 내역</h5>
                <ul class="recent-list">${listHtml || '<li class="text-muted">아직 등록된 하위 위키 문서가 존재하지 않습니다.</li>'}</ul>
              </div>
              <div class="col-md-5">
                <div class="card grammar-card p-3 shadow-sm">
                  <h6 class="fw-bold text-dark border-bottom pb-2">🛠 개인 위키 마크업 문법</h6>
                  <div class="card-body p-0" style="font-size: 0.88rem; line-height: 1.7;">
                    <strong>볼드 표기:</strong> <code>'''텍스트'''</code><br>
                    <strong>취소선 표기:</strong> <code>~~텍스트~~</code><br>
                    <strong>대섹션 정의:</strong> <code>== 섹션명 ==</code> (줄 첫 칸에 작성)<br>
                    <strong>내부 위키 링크:</strong> <code>[[문서제목]]</code><br>
                    <strong>외부 링크 연동:</strong> <code>[https://m.blog.naver.com/elvispress/40209590170]</code><br>
                    <strong>하단 주석 배치:</strong> <code>[* 설명 내용]</code>
                  </div>
                </div>
              </div>
            </div>`;
          document.getElementById('metaInfo').innerText = '';
          document.getElementById('deleteBtn').classList.add('hidden');
          document.getElementById('editBtn').classList.add('hidden');
          return;
        } catch (err) {
          console.error(err);
        }
      }

      // 일반 개별 문서 로드 파트
      document.getElementById('deleteBtn').classList.remove('hidden');
      document.getElementById('editBtn').classList.remove('hidden');
      
      try {
        // Firebase는 파일 경로 구조 특성상 문서 제목 내 특수문자나 마침표 처리를 위해 안전하게 인코딩 보정 후 키값으로 사용
        const safeKey = btoa(encodeURIComponent(title)).replace(/=/g, '');
        const docRef = ref(database, `users/${currentUser.uid}/wiki/${safeKey}`);
        const snapshot = await get(docRef);

        if (snapshot.exists()) {
          const data = snapshot.val();
          currentDoc = { title: data.title, content: data.content };
          const parsed = parseWiki(data.content);
          
          document.getElementById('displayTitle').innerText = data.title;
          document.getElementById('displayContent').innerHTML = parsed.html;
          document.getElementById('metaInfo').innerText = `최종 수정시각: ${data.updatedAt || '-'}`;
          
          if (parsed.fns.length > 0) {
            footnotes = parsed.fns;
            document.getElementById('footnoteSection').style.display = 'block';
            document.getElementById('footnoteItems').innerHTML = parsed.fns.map(f => `<li>${escapeHTML(f)}</li>`).join('');
          }
        } else {
          // 비어있는 새 문서 처리 규칙
          currentDoc = { title: title, content: '' };
          document.getElementById('displayTitle').innerText = title;
          document.getElementById('displayContent').innerHTML = `<p class="text-muted">요청하신 "${escapeHTML(title)}" 문서의 기록 본문이 없습니다. 우측 하단의 편집 버튼을 눌러 첫 서술을 기록해 보세요.</p>`;
          document.getElementById('metaInfo').innerText = '';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('displayContent').innerText = "데이터베이스 보안 규칙 거부 혹은 네트워크 연결 장애로 로드에 실패했습니다.";
      }
    }

    // 마크업 파싱 로직
    function parseWiki(text) {
      if (!text) return { html: "", fns: [] };
      let res = escapeHTML(text);
      let fns = [];
      let toc = [];

      // 1. 주석 처리 [* 내용]
      res = res.replace(/\[\* (.*?)\]/g, (m, p1) => {
        fns.push(p1);
        return `<sup class="footnote" onclick="showTooltip(event, ${fns.length - 1})">[${fns.length}]</sup>`;
      });

      // 2. 볼드 처리 및 취소선 컴포넌트 변환
      res = res.replace(/'''(.*?)'''/g, '<strong>$1</strong>');
      res = res.replace(/~~(.*?)~~/g, '<del class="text-muted">$1</del>');

      // 3. 문단 구분용 인덱싱 (== 섹션 제목 ==)
      // 이스케이프 때문에 생겨난 &lt; &gt; 인코딩 값 보정 매칭
      res = res.replace(/^==\s*(.*?)\s*==$/gm, (m, p1) => {
        const id = "section_" + toc.length;
        toc.push({ id: id, title: p1 });
        return `<h3 id="${id}" class="mt-4 border-bottom pb-2 fw-bold text-dark">${p1}</h3>`;
      });

      // 목차 박스 레이아웃 유동적 추가 조립
      if (toc.length >= 2) {
        let tocHtml = `<div class="toc-container"><span class="toc-title">목차</span><ul>` + 
          toc.map(t => `<li><a href="#${t.id}" style="color:#42a5f5; text-decoration:none;">${t.title}</a></li>`).join('') + `</ul></div><br>`;
        res = tocHtml + res;
      }

      // 4. 하이퍼링크 변환 (내부 문서 이동 vs 외부 링크 아웃)
      // 대괄호 분기를 위한 디코딩 역추적 정규식 설계
      res = res.replace(/\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/g, (m, link, name) => {
        const display = name ? name.trim() : link.trim();
        const target = link.trim();
        // &amp; 처리 등 특수문자 원상 복구 후 검사
        const rawTarget = target.replace(/&amp;/g, '&');
        if (rawTarget.startsWith('http://') || rawTarget.startsWith('https://')) {
          return `<a href="${rawTarget}" target="_blank" class="text-primary text-decoration-none" rel="noopener">${display} 🔗</a>`;
        } else {
          const escapedParam = rawTarget.replace(/'/g, "\\'");
          return `<a onclick="loadPage('${escapedParam}')" class="text-success fw-bold" style="cursor:pointer; text-decoration:none;">${display}</a>`;
        }
      });

      return { html: res.replace(/\n/g, '<br>'), fns: fns };
    }

    // 툴팁 노출 제어
    function showTooltip(e, i) {
      e.stopPropagation();
      const t = document.getElementById('fnTooltip');
      t.innerText = footnotes[i];
      t.style.display = 'block';
      t.style.left = (e.pageX + 10) + 'px'; 
      t.style.top = (e.pageY - 30) + 'px';
    }

    function openEditMode() {
      document.getElementById('viewMode').classList.add('hidden');
      document.getElementById('editMode').classList.remove('hidden');
      document.getElementById('editTitleLabel').innerText = currentDoc.title;
      document.getElementById('editorTextarea').value = currentDoc.content;
    }

    function cancelEdit() {
      loadPage(currentDoc.title);
    }

    // 데이터 업서트 처리 (UPDATE / CREATE)
    async function submitWiki() {
      if (!currentUser) return;
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      const newContent = document.getElementById('editorTextarea').value;
      const title = currentDoc.title;
      const safeKey = btoa(encodeURIComponent(title)).replace(/=/g, '');

      const now = new Date();
      // YYYY-MM-DD HH:mm 형태로 포맷팅 조립
      const formattedDate = now.getFullYear() + '-' + 
        String(now.getMonth() + 1).padStart(2, '0') + '-' + 
        String(now.getDate()).padStart(2, '0') + ' ' + 
        String(now.getHours()).padStart(2, '0') + ':' + 
        String(now.getMinutes()).padStart(2, '0');

      try {
        const docRef = ref(database, `users/${currentUser.uid}/wiki/${safeKey}`);
        await set(docRef, {
          title: title,
          content: newContent,
          updatedAt: formattedDate
        });
        
        currentDoc.content = newContent;
        saveBtn.disabled = false;
        loadPage(title);
      } catch (err) {
        console.error(err);
        alert('문서 저장 권한이 없습니다.');
        saveBtn.disabled = false;
      }
    }

    // 데이터 삭제 처리 (DELETE)
    async function deleteDoc() {
      if (!currentUser || !currentDoc.title) return;
      if (currentDoc.title === '메인페이지') return;

      if (confirm(`현재 읽고 계신 "${currentDoc.title}" 문서를 영구 삭제 처리할까요?`)) {
        const safeKey = btoa(encodeURIComponent(currentDoc.title)).replace(/=/g, '');
        try {
          const docRef = ref(database, `users/${currentUser.uid}/wiki/${safeKey}`);
          await remove(docRef);
          loadPage('메인페이지');
        } catch (err) {
          alert('삭제 권한이 없거나 차단되었습니다.');
        }
      }
    }

    function searchWiki() {
      const v = searchInput.value.trim();
      if (v) {
        searchInput.value = '';
        loadPage(v);
      }
    }

    function createNewWiki() {
      const t = prompt("새로 개설할 위키 문서의 제목을 입력하세요:");
      if (t && t.trim()) {
        if(t.trim() === '메인페이지') {
          alert('예약어는 문서 제목으로 선점할 수 없습니다.');
          return;
        }
        loadPage(t.trim());
      }
    }

    // 헬퍼 이스케이프 처리
    function escapeHTML(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getKoreanError(code) {
      switch (code) {
        case 'auth/invalid-credential': return '이메일 계정 정보 또는 비밀번호가 틀렸습니다.';
        case 'auth/email-already-in-use': return '이미 등록 관리 중인 계정 이메일입니다.';
        case 'auth/weak-password': return '최소 6자리 이상의 패스워드가 필요합니다.';
        default: return `인증 오류가 발생했습니다 (${code})`;
      }
    }
  </script>
  
  <script>
    // 전역 툴팁 소멸자 함수
    function hideTooltip() { 
      const t = document.getElementById('fnTooltip');
      if(t) t.style.display = 'none'; 
    }
  </script>
